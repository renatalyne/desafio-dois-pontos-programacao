name: Pipeline CI para Validação de Login

permissions:
  contents: read

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Inspeção de Código com ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Testes Unitários Automatizados
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Upload do relatório Mochawesome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-validacao-login
          path: reports/

  deploy:
    name: Simulação de Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Simular deploy
        run: echo "Deploy realizado com sucesso!"

